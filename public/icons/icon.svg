<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EF4444"/>
      <stop offset="50%" style="stop-color:#F87171"/>
      <stop offset="100%" style="stop-color:#EF4444"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="#0F172A" rx="100"/>
  
  <!-- Tech circuit pattern (subtle) -->
  <g opacity="0.1" stroke="#3B82F6" stroke-width="2" fill="none">
    <circle cx="100" cy="100" r="40"/>
    <circle cx="412" cy="100" r="40"/>
    <circle cx="100" cy="412" r="40"/>
    <circle cx="412" cy="412" r="40"/>
    <path d="M140,100 L200,100 L250,200 L300,200 L350,100 L372,100"/>
    <path d="M100,140 L100,200 L200,250 L200,300 L100,350 L100,372"/>
  </g>
  
  <!-- Central pulse design -->
  <g transform="translate(56, 150)">
    <!-- Pulse wave line -->
    <path d="M0,106 L80,106 L112,32 L144,180 L176,52 L208,160 L240,80 L272,132 L304,106 L400,106" 
          fill="none" 
          stroke="url(#pulseGrad)" 
          strokeWidth="10" 
          strokeLinecap="round" 
          strokeLinejoin="round"/>
    
    <!-- Data point on pulse -->
    <circle cx="208" cy="106" r="28" fill="url(#techGrad)"/>
    <circle cx="208" cy="106" r="14" fill="#0F172A"/>
    <circle cx="208" cy="106" r="6" fill="#EF4444"/>
  </g>
  
  <!-- Tech nodes -->
  <circle cx="136" cy="256" r="8" fill="#3B82F6"/>
  <circle cx="376" cy="256" r="8" fill="#3B82F6"/>
  
  <!-- Accent dots -->
  <circle cx="448" cy="64" r="12" fill="#EF4444" opacity="0.8"/>
  <circle cx="448" cy="64" r="5" fill="#FCA5A5"/>
</svg>