name: Android Build & Deploy

on:
  push:
    branches: [develop, main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode Google Services JSON
        if: ${{ secrets.TECHPULSE_GOOGLE_SERVICES_JSON != '' }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.TECHPULSE_GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          cd android
          sed -i "s/versionCode 1/versionCode $VERSION_CODE/" app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VERSION\"/" app/build.gradle

      - name: Build Debug APK
        if: github.ref == 'refs/heads/develop' || github.event.inputs.release_type == 'debug'
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Build Release AAB
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_type == 'release'
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload Debug APK
        if: github.ref == 'refs/heads/develop' || github.event.inputs.release_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release AAB
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 90

      - name: Upload to Firebase App Distribution (Debug)
        if: github.ref == 'refs/heads/develop' && secrets.FIREBASE_TOKEN != '' && secrets.TECHPULSE_FIREBASE_APP_ID_ANDROID != ''
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.TECHPULSE_FIREBASE_APP_ID_ANDROID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: internal-qa,beta-testers
          file: android/app/build/outputs/apk/debug/app-debug.apk
          releaseNotes: |
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Build Date: ${{ github.event.head_commit.timestamp }}

      - name: Upload to Firebase App Distribution (Release)
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && secrets.FIREBASE_TOKEN != '' && secrets.TECHPULSE_FIREBASE_APP_ID_ANDROID != ''
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.TECHPULSE_FIREBASE_APP_ID_ANDROID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: internal-qa,beta-testers,stakeholders
          file: android/app/build/outputs/bundle/release/app-release.aab
          releaseNotes: |
            Version: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Release Build
