name: Firebase App Distribution

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to deploy'
        required: true
        type: choice
        options:
          - android
          - ios
          - both
      release_type:
        description: 'Release type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      groups:
        description: 'Tester groups (comma-separated)'
        required: false
        default: 'internal-qa,beta-testers'

jobs:
  deploy-android:
    if: github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Build and sync
        run: |
          npm run build
          npx cap sync android

      - name: Decode Google Services JSON
        if: ${{ secrets.TECHPULSE_GOOGLE_SERVICES_JSON != '' }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.TECHPULSE_GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json

      - name: Build APK
        if: github.event.inputs.release_type == 'debug'
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Build AAB
        if: github.event.inputs.release_type == 'release'
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload to Firebase (Debug)
        if: github.event.inputs.release_type == 'debug'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.TECHPULSE_FIREBASE_APP_ID_ANDROID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: ${{ github.event.inputs.groups }}
          file: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload to Firebase (Release)
        if: github.event.inputs.release_type == 'release'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.TECHPULSE_FIREBASE_APP_ID_ANDROID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: ${{ github.event.inputs.groups }}
          file: android/app/build/outputs/bundle/release/app-release.aab

  deploy-ios:
    if: github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'both'
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and sync
        run: |
          npm run build
          npx cap sync ios

      - name: Decode Google Service Info plist
        if: ${{ secrets.TECHPULSE_GOOGLE_SERVICE_INFO_PLIST != '' }}
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.TECHPULSE_GOOGLE_SERVICE_INFO_PLIST }}
        run: echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 -d > ios/App/App/GoogleService-Info.plist

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Build iOS
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration ${{ github.event.inputs.release_type == 'release' && 'Release' || 'Debug' }} \
            -destination generic/platform=iOS \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload to Firebase
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.TECHPULSE_FIREBASE_APP_ID_IOS }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: ${{ github.event.inputs.groups }}
          file: ios/App/build/Build/Products/Debug-iphonesimulator/App.app
